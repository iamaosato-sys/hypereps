<!doctype html>
<html lang="en-GB">
<head>

<meta name="description" content="HypeReps is a free bodyweight training tracker. Level up from wall push-ups to one-arm push-ups, squats to pistols, hangs to pull-ups — with a hype coach cheering every set.">
<meta name="theme-color" content="#0f1020">
<link rel="canonical" href="https://hypereps.vercel.app/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta property="og:title" content="HypeReps — Free Calisthenics Progress Tracker">
<meta property="og:description" content="Level up your bodyweight training. Free, no account, works offline.">

<script>

  window.GSC_TOKEN = "";
</script>

</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Hype<b>Reps</b></span></div>
  <nav aria-label="Main">
    <button class="nav" data-view="today" aria-current="page">Today</button>
    <button class="nav" data-view="progress">Progress</button>
    <button class="nav" data-view="history">History</button>
    <button class="nav" data-view="settings">Settings</button>
  </nav>
</header>

<main id="main" tabindex="-1"></main>

<div id="hype" class="hype" role="status" aria-live="polite"></div>

</footer>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

</html>
